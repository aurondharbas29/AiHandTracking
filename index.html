<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hand Tracking Hero - AI Viewfinder Mobile</title>
  
  <!-- MediaPipe CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg-color: #0b0b0e;
      --card-bg: #14141d;
      --accent-color: #ffd700;
      --accent-green: #00ff88;
      --accent-red: #ff4757;
      --accent-cyan: #00f2fe;
      --text-main: #ffffff;
      --text-sub: #8f8f9d;
      --border-color: #282836;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    header {
      text-align: center;
      margin-bottom: 12px;
      width: 100%;
    }

    h1 {
      font-size: clamp(1.4rem, 5vw, 2rem);
      letter-spacing: -0.5px;
    }

    h1 i {
      color: var(--accent-color);
      font-style: normal;
    }

    header p {
      color: var(--text-sub);
      font-size: 0.8rem;
      margin-top: 2px;
    }

    .app-card {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 12px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    /* Viewport Responsif Portrait & Landscape */
    .viewport-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000000;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .viewport {
      position: relative;
      width: 100%;
      height: 100%;
      aspect-ratio: 3 / 4; /* Default Mobile Portrait */
      max-height: 65vh;
      transition: aspect-ratio 0.3s ease;
      overflow: hidden;
    }

    .viewport.landscape {
      aspect-ratio: 16 / 9; /* Landscape Mode */
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    /* CSS Filters */
    video.filter-normal { filter: brightness(0.9) contrast(1.1); }
    video.filter-grayscale { filter: grayscale(100%) contrast(1.2); }
    video.filter-sepia { filter: sepia(85%) contrast(1.1); }
    video.filter-vintage { filter: sepia(40%) contrast(1.2) saturate(1.3); }
    video.filter-invert { filter: invert(100%) hue-rotate(180deg); }
    video.filter-warm { filter: sepia(30%) saturate(1.4); }
    video.filter-cool { filter: hue-rotate(180deg) saturate(1.2); }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
      pointer-events: none;
    }

    /* Indicators & Overlays */
    .rec-indicator {
      position: absolute;
      top: 12px;
      left: 12px;
      display: none;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.7);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-red);
      backdrop-filter: blur(4px);
      z-index: 10;
    }

    .rec-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-red);
      border-radius: 50%;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 1; }
      to { opacity: 0.2; }
    }

    .timer-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.5);
      z-index: 12;
    }

    .timer-number {
      font-size: 5rem;
      font-weight: 800;
      color: var(--accent-color);
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
      animation: popZoom 0.9s infinite;
    }

    @keyframes popZoom {
      0% { transform: scale(0.6); opacity: 0; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 0; }
    }

    .status {
      width: 100%;
      text-align: center;
      padding: 8px 12px;
      background: rgba(26, 26, 36, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.82rem;
      color: var(--accent-color);
    }

    /* Control & Selectors Panel */
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
    }

    .selector-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .selector-group label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-sub);
    }

    select, .btn-select {
      background: #20202c;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      outline: none;
      width: 100%;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      width: 100%;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      background: #20202c;
      color: var(--text-main);
      border: 1px solid #323245;
      flex: 1 1 calc(50% - 4px);
    }

    .btn-full {
      flex: 1 1 100%;
    }

    .btn-primary {
      background: var(--accent-color);
      color: #000;
      border: none;
    }

    .btn-danger {
      background: var(--accent-red);
      color: #fff;
      border: none;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .info-box {
      width: 100%;
      background: #101017;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      font-size: 0.78rem;
      color: var(--text-sub);
    }

    .info-box h3 {
      font-size: 0.82rem;
      color: var(--accent-cyan);
      margin-bottom: 6px;
    }

    .info-box ul {
      list-style-type: disc;
      padding-left: 16px;
      line-height: 1.4;
    }

    footer {
      margin-top: 15px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    footer span { color: var(--accent-color); }
  </style>
</head>
<body>

  <header>
    <h1>Translate Your <i>Hands</i></h1>
    <p>AI Hand Tracking - By @Aurond_H</p>
  </header>

  <main class="app-card">
    <div class="viewport-container">
      <div class="viewport" id="viewport">
        <div class="rec-indicator" id="recIndicator">
          <div class="rec-dot"></div>
          <span>REC</span>
        </div>
        <div class="timer-overlay" id="timerOverlay">
          <span class="timer-number" id="timerNumber">5</span>
        </div>
        <video id="webcam" class="filter-normal" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>
      </div>
    </div>

    <div class="status" id="gestureStatus">Kamera belum aktif</div>

    <!-- Pilihan Mode Tampilan & Kamera -->
    <div class="controls-grid">
      <div class="selector-group">
        <label for="aspectToggle">Mode Aspect Ratio:</label>
        <select id="aspectToggle">
          <option value="portrait">📱 Portrait (3:4)</option>
          <option value="landscape">📺 Landscape (16:9)</option>
        </select>
      </div>
      <div class="selector-group">
        <label for="cameraFacing">Arah Kamera:</label>
        <select id="cameraFacing">
          <option value="user">🤳 Depan (Selfie)</option>
          <option value="environment">📷 Belakang</option>
        </select>
      </div>
      <div class="selector-group">
        <label for="cameraFilterSelect">Filter Kamera:</label>
        <select id="cameraFilterSelect">
          <option value="filter-normal">Normal</option>
          <option value="filter-grayscale">Hitam Putih</option>
          <option value="filter-sepia">Sepia</option>
          <option value="filter-vintage">Vintage</option>
          <option value="filter-cool">Cool Blue</option>
          <option value="filter-warm">Warm</option>
          <option value="filter-invert">Invert</option>
        </select>
      </div>
      <div class="selector-group">
        <label for="visualEffect">Mode Frame AI:</label>
        <select id="visualEffect">
          <option value="mono">Mono High-Contrast</option>
          <option value="gradient">Neon Gradient</option>
          <option value="hearts">Floating Hearts ❤️</option>
          <option value="stars">Sparkling Stars ✨</option>
        </select>
      </div>
    </div>

    <!-- Tombol Operasi -->
    <div class="btn-group">
      <button class="btn btn-full" id="toggleCamBtn">
        <span id="camBtnText">🚀 Mulai Kamera AI</span>
      </button>
      <button class="btn btn-primary" id="captureBtn" disabled>
        <span>📷 Foto (5s)</span>
      </button>
      <button class="btn" id="recordBtn" disabled>
        <span id="recordBtnText">🎥 Rekam Video</span>
      </button>
    </div>

    <div class="info-box">
      <h3>💡 Tips Penggunaan di HP:</h3>
      <ul>
        <li>Ganti ke **Landscape** untuk tampilan horizontal lebih luas.</li>
        <li>Pastikan kedua tangan terlihat utuh di layar kamera untuk membentuk frame trapesium.</li>
      </ul>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 <span>Aurond_H</span>. All rights reserved.</p>
  </footer>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const viewport = document.getElementById('viewport');
    const statusText = document.getElementById('gestureStatus');
    
    // Controls
    const visualEffectSelect = document.getElementById('visualEffect');
    const cameraFilterSelect = document.getElementById('cameraFilterSelect');
    const aspectToggle = document.getElementById('aspectToggle');
    const cameraFacing = document.getElementById('cameraFacing');
    const toggleCamBtn = document.getElementById('toggleCamBtn');
    const camBtnText = document.getElementById('camBtnText');
    const captureBtn = document.getElementById('captureBtn');
    const recordBtn = document.getElementById('recordBtn');
    const recordBtnText = document.getElementById('recordBtnText');
    const recIndicator = document.getElementById('recIndicator');
    const timerOverlay = document.getElementById('timerOverlay');
    const timerNumber = document.getElementById('timerNumber');

    const processCanvas = document.createElement('canvas');
    const processCtx = processCanvas.getContext('2d');

    let cameraInstance = null;
    let isCameraActive = false;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    // Smoother Coordinates (EMA)
    let smoothedPoints = null;
    const alpha = 0.35;

    // Partikel
    let heartParticles = [];
    let starParticles = [];

    aspectToggle.addEventListener('change', (e) => {
      if (e.target.value === 'landscape') {
        viewport.classList.add('landscape');
      } else {
        viewport.classList.remove('landscape');
      }
      resizeCanvas();
    });

    cameraFilterSelect.addEventListener('change', (e) => {
      videoElement.className = e.target.value;
    });

    cameraFacing.addEventListener('change', () => {
      if (isCameraActive) startCamera();
    });

    function resizeCanvas() {
      const rect = viewport.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;
      
      if (w > 0 && h > 0) {
        canvasElement.width = w;
        canvasElement.height = h;
        processCanvas.width = w;
        processCanvas.height = h;
      }
    }

    window.addEventListener('resize', resizeCanvas);

    // Helper untuk merender gambar secara cover (menghindari efek gepeng)
    function drawImageCover(ctx, img, cw, ch) {
      const nw = img.videoWidth || img.width;
      const nh = img.videoHeight || img.height;
      if (!nw || !nh) return;

      const scale = Math.max(cw / nw, ch / nh);
      const sw = cw / scale;
      const sh = ch / scale;
      const sx = (nw - sw) / 2;
      const sy = (nh - sh) / 2;

      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, cw, ch);
    }

    function spawnHeart(x, y) {
      if (Math.random() < 0.3) {
        heartParticles.push({
          x: x + (Math.random() * 40 - 20),
          y: y,
          size: Math.random() * 16 + 12,
          speedY: Math.random() * 2 + 1,
          opacity: 1,
          drift: Math.random() * 2 - 1
        });
      }
    }

    function drawHearts(ctx) {
      for (let i = heartParticles.length - 1; i >= 0; i--) {
        const p = heartParticles[i];
        ctx.save();
        ctx.globalAlpha = p.opacity;
        ctx.fillStyle = '#ff4757';
        ctx.font = `${p.size}px Arial`;
        ctx.fillText('❤️', p.x, p.y);
        ctx.restore();
        p.y -= p.speedY;
        p.x += p.drift;
        p.opacity -= 0.02;
        if (p.opacity <= 0) heartParticles.splice(i, 1);
      }
    }

    function spawnStar(x, y) {
      if (Math.random() < 0.35) {
        starParticles.push({
          x: x + (Math.random() * 50 - 25),
          y: y + (Math.random() * 20 - 10),
          size: Math.random() * 16 + 10,
          speedY: Math.random() * 1.8 + 0.8,
          opacity: 1,
          drift: Math.random() * 2 - 1,
          icon: '✨'
        });
      }
    }

    function drawStars(ctx) {
      for (let i = starParticles.length - 1; i >= 0; i--) {
        const p = starParticles[i];
        ctx.save();
        ctx.globalAlpha = p.opacity;
        ctx.font = `${p.size}px Arial`;
        ctx.fillText(p.icon, p.x, p.y);
        ctx.restore();
        p.y -= p.speedY;
        p.x += p.drift;
        p.opacity -= 0.02;
        if (p.opacity <= 0) starParticles.splice(i, 1);
      }
    }

    // MediaPipe Hand Tracker Callback
    function onResults(results) {
      if (!isCameraActive) return;

      resizeCanvas();
      const w = canvasElement.width;
      const h = canvasElement.height;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, w, h);

      const selectedEffect = visualEffectSelect.value;

      if (results.multiHandLandmarks && results.multiHandLandmarks.length >= 2) {
        statusText.innerText = "✨ Frame Trapesium Terbentuk!";
        statusText.style.color = '#00ff88';

        const h1 = results.multiHandLandmarks[0];
        const h2 = results.multiHandLandmarks[1];

        const rawPoints = [
          { x: h1[8].x * w, y: h1[8].y * h },
          { x: h1[4].x * w, y: h1[4].y * h },
          { x: h2[4].x * w, y: h2[4].y * h },
          { x: h2[8].x * w, y: h2[8].y * h }
        ];

        if (!smoothedPoints) {
          smoothedPoints = rawPoints;
        } else {
          smoothedPoints = smoothedPoints.map((pt, i) => ({
            x: pt.x + alpha * (rawPoints[i].x - pt.x),
            y: pt.y + alpha * (rawPoints[i].y - pt.y)
          }));
        }

        const [ptA, ptB, ptC, ptD] = smoothedPoints;

        const hand1AvgX = (ptA.x + ptB.x) / 2;
        const hand2AvgX = (ptC.x + ptD.x) / 2;

        let leftHandPoints = hand1AvgX < hand2AvgX ? [ptA, ptB] : [ptC, ptD];
        let rightHandPoints = hand1AvgX < hand2AvgX ? [ptC, ptD] : [ptA, ptB];

        const topLeft = leftHandPoints[0].y < leftHandPoints[1].y ? leftHandPoints[0] : leftHandPoints[1];
        const bottomLeft = leftHandPoints[0].y < leftHandPoints[1].y ? leftHandPoints[1] : leftHandPoints[0];
        const topRight = rightHandPoints[0].y < rightHandPoints[1].y ? rightHandPoints[0] : rightHandPoints[1];
        const bottomRight = rightHandPoints[0].y < rightHandPoints[1].y ? rightHandPoints[1] : rightHandPoints[0];

        const centerX = (topLeft.x + topRight.x + bottomRight.x + bottomLeft.x) / 4;
        const centerY = (topLeft.y + topRight.y + bottomRight.y + bottomLeft.y) / 4;

        // Clip Frame Trapesium
        canvasCtx.save();
        canvasCtx.beginPath();
        canvasCtx.moveTo(topLeft.x, topLeft.y);
        canvasCtx.lineTo(topRight.x, topRight.y);
        canvasCtx.lineTo(bottomRight.x, bottomRight.y);
        canvasCtx.lineTo(bottomLeft.x, bottomLeft.y);
        canvasCtx.closePath();
        canvasCtx.clip();

        if (selectedEffect === 'mono') {
          processCtx.save();
          drawImageCover(processCtx, videoElement, w, h);
          processCtx.restore();

          const imgData = processCtx.getImageData(0, 0, w, h);
          const data = imgData.data;
          for (let i = 0; i < data.length; i += 4) {
            const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
            const bw = avg > 95 ? 255 : 0;
            data[i] = bw;
            data[i + 1] = bw;
            data[i + 2] = bw;
          }
          processCtx.putImageData(imgData, 0, 0);
          canvasCtx.drawImage(processCanvas, 0, 0);

        } else if (selectedEffect === 'gradient') {
          drawImageCover(canvasCtx, videoElement, w, h);
          const grad = canvasCtx.createLinearGradient(topLeft.x, topLeft.y, bottomRight.x, bottomRight.y);
          grad.addColorStop(0, 'rgba(0, 242, 254, 0.45)');
          grad.addColorStop(1, 'rgba(186, 85, 211, 0.45)');
          canvasCtx.fillStyle = grad;
          canvasCtx.fillRect(0, 0, w, h);

        } else if (selectedEffect === 'hearts') {
          drawImageCover(canvasCtx, videoElement, w, h);
          canvasCtx.fillStyle = 'rgba(255, 105, 180, 0.2)';
          canvasCtx.fillRect(0, 0, w, h);
          spawnHeart(centerX, centerY);

        } else if (selectedEffect === 'stars') {
          drawImageCover(canvasCtx, videoElement, w, h);
          canvasCtx.fillStyle = 'rgba(255, 215, 0, 0.2)';
          canvasCtx.fillRect(0, 0, w, h);
          spawnStar(centerX, centerY);
        }

        canvasCtx.restore();

        // Outline Border Trapesium
        canvasCtx.beginPath();
        canvasCtx.moveTo(topLeft.x, topLeft.y);
        canvasCtx.lineTo(topRight.x, topRight.y);
        canvasCtx.lineTo(bottomRight.x, bottomRight.y);
        canvasCtx.lineTo(bottomLeft.x, bottomLeft.y);
        canvasCtx.closePath();

        canvasCtx.strokeStyle = selectedEffect === 'hearts' ? '#ff4757' : (selectedEffect === 'stars' ? '#ffd700' : '#00f2fe');
        canvasCtx.lineWidth = 3.5;
        canvasCtx.stroke();

      } else {
        smoothedPoints = null;
        if (results.multiHandLandmarks && results.multiHandLandmarks.length === 1) {
          statusText.innerText = "👋 1 Tangan Terdeteksi (Gunakan 2 Tangan)";
          statusText.style.color = '#ffd700';
        } else {
          statusText.innerText = "🔍 Arahkan kedua tangan ke kamera...";
          statusText.style.color = '#8f8f9d';
        }
      }

      if (selectedEffect === 'hearts') drawHearts(canvasCtx);
      if (selectedEffect === 'stars') drawStars(canvasCtx);

      // Render Skeleton Neon
      if (results.multiHandLandmarks) {
        for (const landmarks of results.multiHandLandmarks) {
          drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {
            color: 'rgba(255, 255, 255, 0.5)',
            lineWidth: 1.5
          });
          drawLandmarks(canvasCtx, landmarks, {
            color: '#00f2fe',
            fillColor: '#ffffff',
            lineWidth: 1,
            radius: 2.5
          });
        }
      }

      canvasCtx.restore();
    }

    // Inisialisasi MediaPipe Hands
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults(onResults);

    // Camera Manager
    async function startCamera() {
      statusText.innerText = "Mengaktifkan Kamera...";
      
      if (cameraInstance) {
        await cameraInstance.stop();
      }

      const facingMode = cameraFacing.value;

      cameraInstance = new Camera(videoElement, {
        onFrame: async () => {
          if (isCameraActive) {
            await hands.send({ image: videoElement });
          }
        },
        facingMode: facingMode,
        width: { ideal: 1280 },
        height: { ideal: 720 }
      });

      try {
        await cameraInstance.start();
        isCameraActive = true;
        camBtnText.innerText = "🛑 Matikan Kamera";
        captureBtn.disabled = false;
        recordBtn.disabled = false;
        setTimeout(resizeCanvas, 500);
      } catch (err) {
        console.error("Gagal kamera:", err);
        statusText.innerText = "⚠️ Akses Kamera Ditolak / Tidak Kompatibel";
        statusText.style.color = '#ff4757';
      }
    }

    function stopCamera() {
      if (isRecording) stopRecording();
      if (cameraInstance) cameraInstance.stop();
      
      if (videoElement.srcObject) {
        const tracks = videoElement.srcObject.getTracks();
        tracks.forEach(track => track.stop());
        videoElement.srcObject = null;
      }

      isCameraActive = false;
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      
      camBtnText.innerText = "🚀 Mulai Kamera AI";
      captureBtn.disabled = true;
      recordBtn.disabled = true;
      statusText.innerText = "Kamera Nonaktif";
      statusText.style.color = '#8f8f9d';
    }

    toggleCamBtn.addEventListener('click', () => {
      if (isCameraActive) {
        stopCamera();
      } else {
        startCamera();
      }
    });

    // Capture Photo
    captureBtn.addEventListener('click', () => {
      if (!isCameraActive) return;
      captureBtn.disabled = true;
      recordBtn.disabled = true;
      let count = 5;

      timerNumber.innerText = count;
      timerOverlay.style.display = 'flex';

      const countdownInterval = setInterval(() => {
        count--;
        if (count > 0) {
          timerNumber.innerText = count;
        } else {
          clearInterval(countdownInterval);
          timerOverlay.style.display = 'none';
          executeCapture();
          captureBtn.disabled = false;
          recordBtn.disabled = false;
        }
      }, 1000);
    });

    function executeCapture() {
      const exportCanvas = document.createElement('canvas');
      const exportCtx = exportCanvas.getContext('2d');
      const w = canvasElement.width;
      const h = canvasElement.height;

      exportCanvas.width = w;
      exportCanvas.height = h;

      exportCtx.save();
      exportCtx.scale(-1, 1);
      exportCtx.filter = getComputedStyle(videoElement).filter;
      drawImageCover(exportCtx, videoElement, w, h);
      exportCtx.restore();

      exportCtx.save();
      exportCtx.scale(-1, 1);
      exportCtx.drawImage(canvasElement, -w, 0, w, h);
      exportCtx.restore();

      const dataURL = exportCanvas.toDataURL('image/png');
      const link = document.createElement('a');
      link.href = dataURL;
      link.download = `HandTracking_Mobile_${Date.now()}.png`;
      link.click();
    }

    // Video Recording
    recordBtn.addEventListener('click', () => {
      if (!isRecording) {
        startRecording();
      } else {
        stopRecording();
      }
    });

    function startRecording() {
      recordedChunks = [];
      const streamCanvas = document.createElement('canvas');
      const streamCtx = streamCanvas.getContext('2d');
      const w = canvasElement.width;
      const h = canvasElement.height;
      streamCanvas.width = w;
      streamCanvas.height = h;

      let recordAnimationId;
      function renderRecordFrame() {
        if (!isRecording) return;
        streamCtx.save();
        streamCtx.scale(-1, 1);
        streamCtx.filter = getComputedStyle(videoElement).filter;
        drawImageCover(streamCtx, videoElement, w, h);
        streamCtx.filter = 'none';
        streamCtx.drawImage(canvasElement, -w, 0, w, h);
        streamCtx.restore();

        recordAnimationId = requestAnimationFrame(renderRecordFrame);
      }

      const canvasStream = streamCanvas.captureStream(30);
      mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm' });

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        cancelAnimationFrame(recordAnimationId);
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `HandTracking_Video_${Date.now()}.webm`;
        a.click();
        URL.revokeObjectURL(url);
      };

      isRecording = true;
      mediaRecorder.start();
      renderRecordFrame();

      recordBtn.classList.add('btn-danger');
      recordBtnText.innerText = "⏹ Stop Rekam";
      recIndicator.style.display = 'flex';
      captureBtn.disabled = true;
    }

    function stopRecording() {
      if (!isRecording) return;
      isRecording = false;
      mediaRecorder.stop();

      recordBtn.classList.remove('btn-danger');
      recordBtnText.innerText = "🎥 Rekam Video";
      recIndicator.style.display = 'none';
      captureBtn.disabled = false;
    }
  </script>
</body>
</html>
